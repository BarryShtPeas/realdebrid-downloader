# Reference stack for self-hosting the Real-Debrid Downloader.
#
# Quick start:
#   1. cp .env.example .env
#   2. Edit .env: set REALDEBRID_API_TOKEN, ARIA2_RPC_SECRET, and DOWNLOAD_DIR.
#   3. chmod 600 .env
#   4. docker compose -f compose.example.yml up -d
#   5. Open http://localhost:8080
#
# The API token is read only from .env (via env_file) and is never written into
# this file. .env is gitignored, so your secrets are not committed.

services:
  rd-downloader:
    image: ghcr.io/barryshtpeas/realdebrid-downloader:latest
    env_file:
      - .env
    environment:
      ARIA2_RPC_URL: http://rd-aria2:6800/jsonrpc
      APP_CONFIG_DIR: /config
    ports:
      - "8080:8080"
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - ${DOWNLOAD_DIR:-./downloads}:/downloads
    depends_on:
      - rd-aria2
    restart: unless-stopped

  rd-aria2:
    image: p3terx/aria2-pro:latest
    environment:
      RPC_SECRET: ${ARIA2_RPC_SECRET:-}
      RPC_PORT: 6800
      LISTEN_PORT: 6888
      DISK_CACHE: 64M
      IPV6_MODE: "false"
    volumes:
      - ${ARIA2_CONFIG_DIR:-./aria2-config}:/config
      # Map the container download dir onto your own host directory.
      # Set DOWNLOAD_DIR in .env, e.g. DOWNLOAD_DIR=/mnt/media/downloads
      - ${DOWNLOAD_DIR:-./downloads}:/downloads
    expose:
      - "6800"
    restart: unless-stopped
